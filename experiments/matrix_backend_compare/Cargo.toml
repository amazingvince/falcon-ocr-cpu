[package]
name = "falcon-matrix-backend-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[[bin]]
name = "falcon-matrix-backend-probe"
path = "main.rs"

[dependencies]
anyhow = "=1.0.104"
bytemuck = "=1.25.2"
clap = { version = "=4.6.7", features = ["derive"] }
gemm = "=0.19.0"
memmap2 = "=0.9.11"
rayon = "=1.12.0"
rten-gemm = "=0.26.0"
rten-tensor = "=0.26.0"
safetensors = "=0.8.0"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
