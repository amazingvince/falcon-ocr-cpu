[package]
name = "falcon-ocr"
default-run = "falcon-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A model-specific CPU inference runner for Falcon-OCR"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
gemm = "=0.19.0"
half = { version = "2.7", features = ["bytemuck"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
memmap2 = "0.9"
rayon = "1.12"
safetensors = "=0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake", "require-simd"] }

[features]
# gemm's AVX-512 kernels (runtime-detected) for prefill projections. Changes
# prefill rounding on AVX-512 machines, so it is token-checked, and the
# bitwise gemm-emulation tests in `kernels::prefill64` do not apply.
gemm-avx512 = ["gemm/x86-v4"]

[dev-dependencies]
tempfile = "3.23"

# `cargo clippy -- -D warnings` is the CI gate; see tools/check.sh.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[[bin]]
name = "falcon-ocr"
path = "src/main.rs"

[[bin]]
name = "falcon-ocr-eval"
path = "src/bin/falcon-ocr-eval.rs"
